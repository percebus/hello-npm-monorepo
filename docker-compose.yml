services:
  express-app:
    build:
      context: .
      target: express-app
    command: start
    ports:
      - 8080:3000

  rest-app:
    build:
      context: .
      target: rest-app
    command: start
    ports:
      - 8081:3000

  my-parcel-app:
    build:
      context: .
      target: my-parcel-app
    command: start
    ports:
      - 8082:1234
